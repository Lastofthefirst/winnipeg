        - generic [ref=e59]:
          - paragraph [ref=e60]:
            - text: Bahá’ís everywhere are engaged in a global process of learning that is helping to build their capacity to apply the teachings of
            - link "Bahá’u’lláh" [ref=e61] [cursor=pointer]:
              - /url: https://www.bahai.org/bahaullah/%20
            - text: to the transformation of society. As a contribution to this learning process, the Ruhi Institute carries out action and research in the field, in order to develop programs and materials that enhance the capacity of individuals and communities to serve humanity. Enhancing such capacity in the individual can be likened to walking a path of service, as described in the extract below from a message from the Universal House of Justice, the international governing body of the
            - link "Bahá’í Faith" [ref=e62] [cursor=pointer]:
              - /url: https://www.bahai.org/
            - text: .
          - paragraph [ref=e63]:
            - text: At this site we are providing some information about our programs, along with the historical circumstances and pedagogy underlying their development. For those who, concerned for humanity’s future, desire the betterment of the world, we are making available here
            - link "our first eight courses" [ref=e64] [cursor=pointer]:
              - /url: /en/materials-in-your-language
            - text: and those that branch off from them. All are invited to study them and discuss their content with a few friends.
          - paragraph [ref=e66]:
            - text: The Ruhi Institute
            - text: 24 March 2026
      - generic [ref=e69]:
        - generic [ref=e71]:
          - paragraph [ref=e72]: The Ruhi Institute’s main sequence of courses is organized so as to set the individual . . .
          - paragraph [ref=e73]: “. . . on a path being defined by the accumulating experience of the community in its endeavor to open before humanity the vision of Bahá’u’lláh’s World Order.”
        - paragraph [ref=e83]: “The very notion of a path is, itself, indicative of the nature and purpose of the courses, for a path invites participation, it beckons to new horizons, it demands effort and movement, it accommodates different paces and strides, it is structured and defined.”
        - paragraph [ref=e89]: “A path can be experienced and known, not only by one or two but by scores upon scores; it belongs to the community.”
        - paragraph [ref=e95]: “To walk a path is a concept equally expressive. It requires of the individual volition and choice; it calls for a set of skills and abilities but also elicits certain qualities and attitudes; it necessitates a logical progression but admits, when needed, related lines of exploration; it may seem easy at the outset but becomes more challenging further along.”
        - paragraph [ref=e100]:
          - text: “And crucially, one walks the path
          - text: in the company of others.”
