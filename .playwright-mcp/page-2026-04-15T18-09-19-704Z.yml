          - heading "Core principles - The oneness of humanity is the central teaching of the Bahá'í Faith." [level=2] [ref=e134]:
            - generic [ref=e135]: Core principles
            - generic [ref=e136]: "-"
            - generic [ref=e137]: The oneness of humanity is the central teaching of the Bahá'í Faith.
          - paragraph [ref=e139]: Bahá'ís believe that humanity is one family, that women and men are equal, and that the diversity of the human race is a source of strength.
        - list [ref=e143]:
          - listitem [ref=e144]:
            - generic [ref=e146]:
              - strong [ref=e147]: Unity of humanity.
              - text: The principle that all people belong to one human family—bound together regardless of race, nation, or creed—is the cornerstone of the Bahá'í Faith.
          - listitem [ref=e148]:
            - generic [ref=e150]:
              - strong [ref=e151]: Equality of women and men.
              - text: "Humanity is like a bird: one wing is women, the other men. Only when both wings are equally strong can the bird fly."
          - listitem [ref=e152]:
            - generic [ref=e154]:
              - strong [ref=e155]: Elimination of prejudice.
              - text: Of all forms of prejudice, the most destructive is racial prejudice. Bahá'ís strive actively to build bonds across every line of division.
          - listitem [ref=e156]:
            - generic [ref=e158]:
              - strong [ref=e159]: Harmony of science and religion.
              - text: Religion without science is superstition; science without religion is materialism. Both are needed for human progress.
          - listitem [ref=e160]:
            - generic [ref=e162]:
              - strong [ref=e163]: Independent investigation of truth.
              - text: Each person has the right and responsibility to search for truth independently, unfettered by superstition or tradition.
          - listitem [ref=e164]:
            - generic [ref=e166]:
              - strong [ref=e167]: Universal education.
              - text: Every child deserves access to education. Knowledge is a treasure and the means of progress for every community.
      - generic [ref=e170]:
        - generic [ref=e171]:
          - generic [ref=e174]:
            - heading "Our community - The Bahá'ís of Winnipeg" [level=2] [ref=e175]:
              - generic [ref=e176]: Our community
              - generic [ref=e177]: "-"
              - generic [ref=e178]: The Bahá'ís of Winnipeg
            - paragraph [ref=e180]: Like the two rivers that meet at the Forks, the Bahá'í Community of Winnipeg draws together people from many backgrounds, united by a shared vision of building a more just and peaceful world.
          - generic [ref=e181]:
            - paragraph [ref=e182]: The Bahá'í community in Winnipeg has been present for over a century, growing from a handful of early believers into a vibrant community that reflects the city's rich multicultural heritage. Today, members from dozens of cultural backgrounds come together in a spirit of unity.
            - paragraph [ref=e183]: Our community centre on McMillan Avenue serves as a gathering place for devotional programs, study circles, children's classes, and community celebrations. We are deeply engaged in the life of our neighbourhoods, working alongside others to foster community building and social action.
            - paragraph [ref=e184]: Like the vast prairie sky that reminds us there is always room for growth, we believe that every person has a contribution to make. Whether you are exploring the Bahá'í Faith for the first time or looking for a welcoming community, we invite you to connect with us.
