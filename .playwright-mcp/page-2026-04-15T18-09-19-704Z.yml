        - heading "About - The Bahá'í Faith" [level=1] [ref=e98]:
          - generic [ref=e99]: About
          - generic [ref=e100]: "-"
          - generic [ref=e101]: The Bahá'í Faith
        - generic [ref=e102]:
          - paragraph [ref=e103]: The Bahá'í Faith is a world religion whose purpose is to unite all peoples in one universal cause and one common faith.
          - generic [ref=e104]:
            - paragraph [ref=e105]: Founded by Bahá'u'lláh in the nineteenth century, the Bahá'í Faith has spread to virtually every country and territory on Earth, embracing people from more than 2,100 ethnic, racial, and tribal backgrounds. At the heart of the Faith is the conviction that humanity is one single race, and that the day has come for humanity's unification into one global society.
            - paragraph [ref=e106]: Bahá'ís are engaged in a global endeavour to build vibrant communities that reflect the principles of justice, unity, and service. Through grassroots activities such as devotional gatherings, study circles, and programs for children and youth, Bahá'ís and their friends work together to translate spiritual principles into social action.
