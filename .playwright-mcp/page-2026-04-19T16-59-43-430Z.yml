    - main [ref=e94]:
      - generic [ref=e97]:
        - heading "Learn more - Exploring the Bahá'í Faith" [level=1] [ref=e98]:
          - generic [ref=e99]: Learn more
          - generic [ref=e100]: "-"
          - generic [ref=e101]: Exploring the Bahá'í Faith
        - generic [ref=e102]:
          - paragraph [ref=e103]: The Bahá'í Faith addresses both the spiritual life of the individual and the structures of human society — offering a coherent vision of justice, unity, and the oneness of humankind.
          - paragraph [ref=e105]: Founded in the nineteenth century, the Faith has spread to virtually every country and territory on Earth. Its central conviction is that humanity is one family, that all the world's great religions come from the same divine source, and that the long-promised age of peace is now within humanity's reach.
      - generic [ref=e107]:
        - generic [ref=e110]:
          - heading "Central figures - The founders and exemplar of the Bahá'í Faith" [level=2] [ref=e111]:
            - generic [ref=e112]: Central figures
            - generic [ref=e113]: "-"
            - generic [ref=e114]: The founders and exemplar of the Bahá'í Faith
          - paragraph [ref=e116]: The Bahá'í Faith centres on the lives and writings of three figures — the Báb, Bahá'u'lláh, and 'Abdu'l-Bahá — whose vision of humanity's oneness continues to inspire millions around the world.
        - list [ref=e119]:
          - listitem [ref=e120]:
            - generic [ref=e122]:
              - strong [ref=e123]: Bahá'u'lláh (1817–1892).
              - text: The Founder of the Bahá'í Faith and its central figure. Born in Tehran, Bahá'u'lláh endured forty years of exile and imprisonment for proclaiming His message that humanity is one family and that the long-awaited moment for its unification has arrived. His writings encompass over 100 volumes and form the sacred scripture of the Faith.
          - listitem [ref=e124]:
            - generic [ref=e126]:
              - strong [ref=e127]: The Báb (1819–1850).
              - text: The Herald of the Bahá'í Faith. In 1844, the Báb declared His mission and called humanity to spiritual renewal, announcing the imminent appearance of the Promised One foretold in the sacred traditions of all religions. He was executed in 1850 in Tabriz, Persia, at the age of thirty.
          - listitem [ref=e128]:
            - generic [ref=e130]:
              - strong [ref=e131]: "'Abdu'l-Bahá (1844–1921)."
              - text: "The son of Bahá'u'lláh and the Centre of His Covenant — appointed by Bahá'u'lláh as the sole authoritative interpreter of His teachings. 'Abdu'l-Bahá is regarded as the perfect exemplar of Bahá'í life: one in whom all the spiritual and humanitarian virtues of the Faith found complete expression."
      - generic [ref=e132]:
        - generic [ref=e136]:
          - heading "Core teachings - The oneness of God, religion, and humanity" [level=2] [ref=e137]:
            - generic [ref=e138]: Core teachings
            - generic [ref=e139]: "-"
            - generic [ref=e140]: The oneness of God, religion, and humanity
          - paragraph [ref=e142]: At the heart of the Bahá'í Faith are teachings about the oneness of God and religion, the oneness of humanity and freedom from prejudice, and the harmony of science and religion. These are not abstract ideals — they are principles for the ordering of human life and the building of civilisation.
        - list [ref=e146]:
          - listitem [ref=e147]:
            - generic [ref=e149]:
              - strong [ref=e150]: Oneness of God.
              - text: There is only one God — unknowable in essence, yet made known to humanity through a succession of divine Messengers. All the great religions of the world flow from this one source.
          - listitem [ref=e151]:
            - generic [ref=e153]:
              - strong [ref=e154]: Progressive revelation.
              - text: Religious truth is revealed progressively. The Manifestations of God — Abraham, Moses, Buddha, Christ, Muhammad, Bahá'u'lláh — each brought teachings suited to the needs and capacity of the age in which they appeared.
          - listitem [ref=e155]:
            - generic [ref=e157]:
              - strong [ref=e158]: Oneness of humanity.
              - text: “The earth is but one country, and mankind its citizens.” The diversity of the human race is not a source of division but a cause of love and harmony. All prejudice — of race, class, nationality, or religion — must be overcome.
          - listitem [ref=e159]:
            - generic [ref=e161]:
              - strong [ref=e162]: Inherent nobility.
              - text: Every human being is a mine rich in gems of inestimable value. The purpose of education, spiritual and material alike, is to reveal these inner capacities in service to one another and to civilisation.
          - listitem [ref=e163]:
            - generic [ref=e165]:
              - strong [ref=e166]: Harmony of science and religion.
              - text: Science and religion are two complementary systems of knowledge. Religion without science leads to superstition; science without religion leads to materialism. Both are essential to human progress.
          - listitem [ref=e167]:
            - generic [ref=e169]:
              - strong [ref=e170]: Justice.
              - text: Justice is the best-beloved of all things in the sight of God and the centrality of justice to all human endeavours is a cornerstone of Bahá'í social teaching. A just society upholds the rights and dignity of every person.
